# One-off (AMM-156): apply PHPCBF's automatic WordPress Coding Standards fixes
# on this branch, commit them, and delete this workflow in the same commit.
name: PHPCBF (one-off)

on:
  push:
    branches: [phpcs-cleanup]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install PHPCS + WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress "wp-coding-standards/wpcs:^3.1"
          echo "$(composer global config bin-dir --absolute --quiet)" >> "$GITHUB_PATH"

      - name: Run PHPCBF
        run: phpcbf --standard=phpcs.xml.dist || true

      - name: Commit the fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "$(printf '%s@%s' '41898282+github-actions[bot]' 'users.noreply.github.com')"
          git rm -q .github/workflows/phpcbf-once.yml
          git add -A
          git commit -q -m "PHPCBF: automatic WordPress Coding Standards fixes (AMM-156)"
          git push origin HEAD:phpcs-cleanup
