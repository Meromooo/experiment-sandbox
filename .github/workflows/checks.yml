# Checks on every push, and the sandbox deploy (AMM-156).
#
# Hostinger deploys the `deploy` branch, not `main`. This workflow moves
# `deploy` to the pushed commit only when every blocking check below passes,
# so a PHP syntax error, a stale build/ or an email address never reaches
# the sandbox — it stays on the last good commit and GitHub emails the owner.
#
# Blocking: php-lint, build, json, email-guard.
# Report-only for now: phpcs (WordPress Coding Standards) — see AMM-156.

name: Checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older one on the same branch.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax (php -l, PHP 8.3)
    # ubuntu-24.04 ships PHP 8.3 and Composer: the sandbox runs 8.3.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint every tracked PHP file
        run: |
          php -v | head -1
          status=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! output=$(php -l "$file" 2>&1); then
              echo "::error file=${file}::${output}"
              status=1
            fi
          done < <(git ls-files -z -- '*.php')
          echo "Linted ${count} PHP files." | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"

  phpcs:
    name: WordPress Coding Standards (report-only)
    runs-on: ubuntu-24.04
    # Report-only until the existing violations are fixed (AMM-156, step 5).
    continue-on-error: true
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - name: Install PHPCS + WordPress Coding Standards (on the runner only)
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress "wp-coding-standards/wpcs:^3.1"
          echo "$(composer global config bin-dir --absolute --quiet)" >> "$GITHUB_PATH"

      - name: Run PHPCS
        run: |
          phpcs --version
          status=0
          phpcs --standard=phpcs.xml.dist --report=json > report.json || status=1
          phpcs --standard=phpcs.xml.dist --report=source --report-width=120 > source.txt || true
          phpcs --standard=phpcs.xml.dist --report=full --report-width=150 || true
          cat source.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
        id: phpcs

      # Job logs need an owner's sign-in even on a public repo, but check runs
      # are public: the report is posted as the "PHPCS report" check on the
      # commit — totals and counts by sniff in its summary, one annotation per
      # violation (50 per request, the API's batch size).
      - name: Publish the report as a check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs"

          def call(method, url, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req) as res:
                  return json.load(res)

          report = json.load(open("report.json"))
          totals = report["totals"]
          annotations = []
          for path, data in report["files"].items():
              rel = os.path.relpath(path)
              for m in data["messages"]:
                  line = max(1, int(m.get("line") or 1))
                  annotations.append({
                      "path": rel,
                      "start_line": line,
                      "end_line": line,
                      "annotation_level": "failure" if m["type"] == "ERROR" else "warning",
                      "message": f"{m['source']}: {m['message']}"[:60000],
                  })

          title = f"{totals['errors']} errors, {totals['warnings']} warnings ({totals['fixable']} auto-fixable)"
          summary = "Report-only (AMM-156).\n\n```\n" + open("source.txt").read()[:60000] + "\n```"
          run = call("POST", base, {"name": "PHPCS report", "head_sha": os.environ["GITHUB_SHA"], "status": "in_progress"})
          for i in range(0, len(annotations), 50):
              call("PATCH", f"{base}/{run['id']}", {"output": {"title": title, "summary": summary, "annotations": annotations[i:i + 50]}})
          call("PATCH", f"{base}/{run['id']}", {"status": "completed", "conclusion": "neutral", "output": {"title": title, "summary": summary}})
          print(title)
          PY

      - name: Fail the job when there are violations (still report-only overall)
        run: exit "${{ steps.phpcs.outputs.status }}"

  build:
    name: build/ matches the source (ADR-001)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Build the blocks
        run: npm run build

      - name: Fail if build/ changed
        run: |
          if [ -n "$(git status --porcelain -- build/)" ]; then
            echo "::error::build/ is out of date with src/. Run npm run build and commit build/ (ADR-001) — otherwise the change is not live."
            git status --porcelain -- build/
            git --no-pager diff --stat -- build/
            exit 1
          fi
          echo "build/ is up to date with src/." | tee -a "$GITHUB_STEP_SUMMARY"

  json:
    name: theme.json and block.json parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Parse every theme.json and block.json
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const files = execSync("git ls-files theme.json \"*block.json\"").toString().trim().split("\n");
            let bad = 0;
            for (const file of files) {
              try { JSON.parse(fs.readFileSync(file, "utf8")); }
              catch (e) { console.log(`::error file=${file}::${e.message}`); bad++; }
            }
            const line = `Parsed ${files.length} JSON files, ${bad} invalid.`;
            console.log(line);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
            process.exit(bad ? 1 : 0);
          '

  email-guard:
    name: No email addresses in the repo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # CLAUDE.md: staff email addresses never appear in the repo, in markup or
      # in JavaScript. Image names like logo@2x.png and package@1.2.3 strings
      # are not addresses; package-lock.json is third-party metadata.
      - name: Search every tracked file
        run: |
          pattern='[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.(?!(png|jpe?g|gif|webp|avif|svg|woff2?|css|js|json|map)\b)[A-Za-z]{2,}\b'
          # The `if` must test git grep's own status (0 = found, 1 = none): an
          # earlier version piped it through cut, whose status is always 0, and
          # failed every push. File and line only — the address itself is not
          # repeated in the log.
          if hits=$(git grep -InP "$pattern" -- . ':!package-lock.json'); then
            while IFS= read -r hit; do
              file=${hit%%:*}
              rest=${hit#*:}
              echo "::error file=${file},line=${rest%%:*}::Email address found here. Staff emails never belong in the repo (CLAUDE.md)."
            done <<< "$hits"
            echo "::error::An email address is in the repo — remove it before this can deploy."
            exit 1
          fi
          echo "No email addresses found." | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to the sandbox (move the deploy branch)
    if: github.ref == 'refs/heads/main'
    needs: [php-lint, build, json, email-guard]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fast-forward only: deploy is written by this job alone, so a rejected
      # push means someone moved it by hand — stop and look, don't force.
      - name: Fast-forward deploy to this commit
        run: |
          git push origin "HEAD:refs/heads/deploy"
          echo "Sandbox deploy branch now at ${GITHUB_SHA}." | tee -a "$GITHUB_STEP_SUMMARY"
